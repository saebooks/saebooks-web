{% if flash %}
<div class="rounded-md border border-emerald-300 bg-emerald-50 px-4 py-3 text-base text-emerald-900 mb-4" role="status">{{ flash }}</div>
{% endif %}
{% if flash_error %}
<div class="rounded-md bg-rose-50 border border-rose-300 px-4 py-3 text-base text-rose-800 mb-4" role="alert">{{ flash_error }}</div>
{% endif %}
{% if error %}
<div class="rounded-md bg-rose-50 border border-rose-300 px-4 py-3 text-base text-rose-800 mb-4" role="alert">{{ error }}</div>
{% endif %}
